<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NEXUS - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #fff4fb;

            background-color: #0a0308;

            background-image:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(255, 0, 120, 0.18),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 20%,
                    rgba(160, 0, 220, 0.15),
                    transparent 40%
                ),
                radial-gradient(
                    circle at 50% 100%,
                    rgba(200, 0, 120, 0.12),
                    transparent 40%
                );
        }

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 20px;
        }

        .login-box {
            width: 100%;
            max-width: 430px;
            padding: 38px;
            border-radius: 20px;

            background: rgba(28, 10, 25, 0.88);

            border: 1px solid rgba(255, 72, 164, 0.45);

            box-shadow:
                0 15px 45px rgba(0, 0, 0, 0.45),
                0 0 30px rgba(255, 63, 159, 0.08);

            backdrop-filter: blur(15px);
        }

        .logo {
            text-align: center;
            font-size: 38px;
            font-weight: 800;
            letter-spacing: 3px;
            color: #ffffff;

            text-shadow:
                0 0 15px rgba(255, 63, 159, 0.5);
        }

        .subtitle {
            text-align: center;
            margin-top: 5px;
            margin-bottom: 30px;

            color: #ffb7dc;
            font-size: 16px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #fff4fb;
        }

        .login-box form {
            display: flex;
            flex-direction: column;
        }

        .login-box label {
            margin-bottom: 8px;
            color: #fff4fb;
            font-weight: 600;
        }

        .login-box input {
            width: 100%;
            padding: 13px 15px;
            margin-bottom: 18px;

            border-radius: 9px;
            border: 1px solid rgba(255, 72, 164, 0.35);

            background: rgba(255, 255, 255, 0.07);

            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .login-box input:focus {
            border-color: #ff3f9f;

            box-shadow:
                0 0 0 2px rgba(255, 63, 159, 0.12);
        }

        .login-box input::placeholder {
            color: #927d8f;
        }

        .login-box button {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 9px;

            background: linear-gradient(
                90deg,
                #ff3f9f,
                #a84cff
            );

            color: white;
            font-size: 16px;
            font-weight: 700;

            cursor: pointer;

            transition: 0.2s ease;
        }

        .login-box button:hover {
            transform: translateY(-1px);

            box-shadow:
                0 8px 20px rgba(255, 63, 159, 0.25);
        }

        .forgot {
            text-align: center;
            margin-top: 20px;
        }

        .forgot a {
            color: #ff72bc;
            text-decoration: none;
            font-weight: 600;
        }

        .forgot a:hover {
            color: #ffffff;
        }

        .register {
            text-align: center;
            margin-top: 18px;
            color: #cbb6c7;
        }

        .register a {
            color: #ff72bc;
            text-decoration: none;
            font-weight: 700;
        }

        .register a:hover {
            color: #ffffff;
        }

        .flash-message {
            padding: 10px 12px;
            margin-bottom: 18px;

            border-radius: 8px;

            background: rgba(255, 63, 159, 0.12);
            border: 1px solid rgba(255, 63, 159, 0.3);

            color: #ffd9ed;
            text-align: center;
        }

        @media (max-width: 500px) {
            .login-box {
                padding: 28px 22px;
            }

            .logo {
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

<div class="page">

    <div class="login-box">

        <div class="logo">
            NEXUS
        </div>

        <div class="subtitle">
            AI Decision & Action Agent
        </div>

        <h2>
            Login
        </h2>


        {% with messages = get_flashed_messages() %}
            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}
        {% endwith %}


        <form method="POST"
              action="{{ url_for('login') }}">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your email"
                required
            >


            <label>
                Password
            </label>

            <input
                type="password"
                name="password"
                placeholder="Enter your password"
                required
            >


            <button type="submit">
                Login
            </button>

        </form>


        <div class="forgot">

            <a href="{{ url_for('forgot_password') }}">
                Forgot Password?
            </a>

        </div>


        <div class="register">

            Don't have an account?

            <a href="{{ url_for('register') }}">
                Create Account
            </a>

        </div>

    </div>

</div>

</body>
</html>
