<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NEXUS - Reset Password</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

    <style>

        .reset-container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .reset-box {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            border-radius: 20px;
            background: rgba(40, 10, 35, 0.85);
            border: 1px solid rgba(255, 80, 180, 0.35);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .reset-box h1 {
            text-align: center;
            margin-bottom: 8px;
        }

        .reset-box h2 {
            text-align: center;
            margin-bottom: 25px;
        }

        .reset-box form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .reset-box label {
            font-weight: 600;
        }

        .reset-box input {
            width: 100%;
            padding: 12px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.08);
            color: white;
            box-sizing: border-box;
        }

        .reset-box input::placeholder {
            color: #aaa;
        }

        .reset-box button {
            margin-top: 10px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(90deg, #ff2b9d, #9b4dff);
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .reset-box button:hover {
            opacity: 0.9;
        }

        .back-login {
            text-align: center;
            margin-top: 20px;
        }

        .back-login a {
            color: #ff8dcc;
            text-decoration: none;
            font-weight: 600;
        }

        .flash-message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 8px;
            text-align: center;
        }

    </style>

</head>


<body>

<div class="reset-container">

    <div class="reset-box">

        <h1>🧠 NEXUS</h1>

        <h2>Reset Password</h2>


        {% with messages = get_flashed_messages() %}

            {% if messages %}

                {% for message in messages %}

                    <div class="flash-message">
                        {{ message }}
                    </div>

                {% endfor %}

            {% endif %}

        {% endwith %}


        <form method="POST">

            <label>
                Email
            </label>

            <input
                type="email"
                name="email"
                placeholder="Enter your registered email"
                required
            >


            <label>
                New Password
            </label>

            <input
                type="password"
                name="new_password"
                placeholder="Minimum 6 characters"
                minlength="6"
                required
            >


            <label>
                Confirm New Password
            </label>

            <input
                type="password"
                name="confirm_password"
                placeholder="Re-enter your new password"
                minlength="6"
                required
            >


            <button type="submit">
                Reset Password
            </button>

        </form>


        <div class="back-login">

            Remember your password?

            <a href="{{ url_for('login') }}">
                Login
            </a>

        </div>

    </div>

</div>

</body>

</html>
